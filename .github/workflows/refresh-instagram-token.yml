# Instagram long-lived tokens expire after 60 days. This refreshes it on the 1st of each month
# and saves it back to the IG_ACCESS_TOKEN secret. Needs a GH_PAT secret with permission to edit secrets.
name: Refresh Instagram token

on:
  schedule:
    - cron: "17 15 1 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh and save token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ] || [ -z "$GH_TOKEN" ]; then echo "IG_ACCESS_TOKEN or GH_PAT not set; skipping."; exit 0; fi
          NEW=$(node scripts/instagram.mjs --refresh-token)
          echo "::add-mask::$NEW"
          gh secret set IG_ACCESS_TOKEN --body "$NEW" --repo "$GITHUB_REPOSITORY"
          echo "Token refreshed."
