# Visits every "More info" link and lists the broken ones and the ones that land on the wrong page.
# The report is saved to reports/link-report.md (and the run's Summary page), where Sunday's research agent
# picks it up and fixes the bad links. Runs Saturday mornings and by hand.
name: Link check

on:
  schedule:
    - cron: "17 13 * * 6" # Saturday ~8 am Houston, ahead of Sunday's research run
  workflow_dispatch:

permissions:
  contents: write

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/check-links.mjs
      - name: Save the report
        run: |
          git config user.name "Spring Branch Littles bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/*-report.md
          git diff --cached --quiet || { git commit -m "Link check $(date -u +%F)"; git pull --rebase; git push; }
